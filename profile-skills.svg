<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-label="Mehrab's engineering ecosystem: AI and machine learning, LLMs, data, backend, DevOps, and security">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090D19"/>
      <stop offset=".55" stop-color="#11152B"/>
      <stop offset="1" stop-color="#1A1230"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#A5B4FC" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="26" fill="url(#grid)"/>
  <ellipse cx="610" cy="145" rx="520" ry="175" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="610;720;610;500;610" dur="20s" repeatCount="indefinite"/>
  </ellipse>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="43" fill="#94A3B8" font-size="12" font-weight="700" letter-spacing="4">ONE ENGINEERING ECOSYSTEM</text>
    <text x="600" y="72" fill="#F8FAFC" font-size="22" font-weight="800" letter-spacing="1.5">FROM INTELLIGENT MODELS TO PRODUCTION SYSTEMS</text>
  </g>

  <g fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 10">
    <path d="M120 155 C180 95 245 95 300 155 S420 215 480 155 S600 95 660 155 S780 215 840 155 S960 95 1080 155">
      <animate attributeName="stroke-dashoffset" values="0;-90" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M120 155 C120 230 220 252 300 230 M480 155 C480 245 600 265 720 230 M840 155 C840 245 960 252 1080 230" opacity=".5">
      <animate attributeName="stroke-dashoffset" values="0;75" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(120 155)">
      <circle r="51" fill="#8B5CF6" fill-opacity=".08" stroke="#A78BFA" stroke-opacity=".7"/>
      <circle r="42" fill="none" stroke="#8B5CF6" stroke-opacity=".42" stroke-dasharray="3 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
      </circle>
      <text y="7" font-size="21" fill="#DDD6FE" font-weight="800">AI</text>
      <text y="78" font-size="13" fill="#F8FAFC" font-weight="700">ML · DEEP LEARNING</text>
      <text y="96" font-size="10" fill="#94A3B8">Models · Vision · NLP</text>
    </g>

    <g transform="translate(312 155)">
      <circle r="51" fill="#22D3EE" fill-opacity=".06" stroke="#67E8F9" stroke-opacity=".65"/>
      <circle r="42" fill="none" stroke="#22D3EE" stroke-opacity=".38" stroke-dasharray="3 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
      </circle>
      <text y="7" font-size="21" fill="#A5F3FC" font-weight="800">LLM</text>
      <text y="78" font-size="13" fill="#F8FAFC" font-weight="700">LLM · AGENTS</text>
      <text y="96" font-size="10" fill="#94A3B8">RAG · MCP · Retrieval</text>
    </g>

    <g transform="translate(504 155)">
      <circle r="51" fill="#8B5CF6" fill-opacity=".08" stroke="#A78BFA" stroke-opacity=".7"/>
      <circle r="42" fill="none" stroke="#8B5CF6" stroke-opacity=".42" stroke-dasharray="3 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      </circle>
      <text y="7" font-size="21" fill="#DDD6FE" font-weight="800">DATA</text>
      <text y="78" font-size="13" fill="#F8FAFC" font-weight="700">DATA · ANALYTICS</text>
      <text y="96" font-size="10" fill="#94A3B8">SQL · EDA · Pipelines</text>
    </g>

    <g transform="translate(696 155)">
      <circle r="51" fill="#22D3EE" fill-opacity=".06" stroke="#67E8F9" stroke-opacity=".65"/>
      <circle r="42" fill="none" stroke="#22D3EE" stroke-opacity=".38" stroke-dasharray="3 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
      </circle>
      <text y="7" font-size="21" fill="#A5F3FC" font-weight="800">API</text>
      <text y="78" font-size="13" fill="#F8FAFC" font-weight="700">BACKEND · WEB</text>
      <text y="96" font-size="10" fill="#94A3B8">FastAPI · Next.js · DB</text>
    </g>

    <g transform="translate(888 155)">
      <circle r="51" fill="#8B5CF6" fill-opacity=".08" stroke="#A78BFA" stroke-opacity=".7"/>
      <circle r="42" fill="none" stroke="#8B5CF6" stroke-opacity=".42" stroke-dasharray="3 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      </circle>
      <text y="7" font-size="21" fill="#DDD6FE" font-weight="800">OPS</text>
      <text y="78" font-size="13" fill="#F8FAFC" font-weight="700">DEVOPS · MLOPS</text>
      <text y="96" font-size="10" fill="#94A3B8">Docker · CI/CD · Linux</text>
    </g>

    <g transform="translate(1080 155)">
      <circle r="51" fill="#22D3EE" fill-opacity=".06" stroke="#67E8F9" stroke-opacity=".65"/>
      <circle r="42" fill="none" stroke="#22D3EE" stroke-opacity=".38" stroke-dasharray="3 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="32s" repeatCount="indefinite"/>
      </circle>
      <text y="7" font-size="21" fill="#A5F3FC" font-weight="800">SEC</text>
      <text y="78" font-size="13" fill="#F8FAFC" font-weight="700">SECURITY · SYSTEMS</text>
      <text y="96" font-size="10" fill="#94A3B8">AppSec · Linux · x86-64</text>
    </g>
  </g>

  <g fill="#C4B5FD">
    <circle cx="120" cy="155" r="3"><animate attributeName="r" values="2;5;2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="312" cy="155" r="3"><animate attributeName="r" values="3;5;3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="504" cy="155" r="3"><animate attributeName="r" values="2;5;2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="696" cy="155" r="3"><animate attributeName="r" values="3;5;3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="888" cy="155" r="3"><animate attributeName="r" values="2;5;2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="155" r="3"><animate attributeName="r" values="3;5;3" dur="3.9s" repeatCount="indefinite"/></circle>
  </g>

  <path d="M60 285 H1140" stroke="url(#edge)" stroke-width="2">
    <animate attributeName="opacity" values=".3;1;.3" dur="5s" repeatCount="indefinite"/>
  </path>
  <text x="600" y="310" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" letter-spacing="2">ENGINEERING · RESEARCH · BUILD · MEASURE · IMPROVE</text>
</svg>