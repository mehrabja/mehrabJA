<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Mehrab Jalilian — AI Engineer and Researcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B16"/>
      <stop offset=".52" stop-color="#101326"/>
      <stop offset="1" stop-color="#17112D"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset=".48" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset=".48" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aurora">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".56"/>
      <stop offset=".42" stop-color="#6366F1" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".42"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#A5B4FC" stroke-opacity=".075" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#C4B5FD" fill-opacity=".22"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>

  <ellipse cx="1000" cy="105" rx="260" ry="190" fill="url(#aurora)" filter="url(#blur)">
    <animate attributeName="cx" values="1000;900;1020;1000" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="105;150;90;105" dur="11s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="180" cy="330" rx="230" ry="130" fill="url(#cyanGlow)" filter="url(#blur)">
    <animate attributeName="cx" values="180;280;180" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="none" stroke-linecap="round">
    <path d="M720 24 C900 80 880 245 1160 292" stroke="#8B5CF6" stroke-opacity=".18" stroke-width="1.5"/>
    <path d="M760 12 C940 72 930 220 1180 260" stroke="#22D3EE" stroke-opacity=".14" stroke-width="1"/>
    <path d="M680 345 C850 270 1020 330 1190 205" stroke="url(#trace)" stroke-width="2.5" stroke-dasharray="8 13">
      <animate attributeName="stroke-dashoffset" values="0;-84" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M54 285 C260 245 390 330 610 276" stroke="url(#trace)" stroke-width="1.5" stroke-dasharray="5 11">
      <animate attributeName="stroke-dashoffset" values="0;64" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(990 166)" fill="none" stroke-width="1.2">
    <ellipse rx="145" ry="54" stroke="#A78BFA" stroke-opacity=".26" transform="rotate(-28)">
      <animateTransform attributeName="transform" type="rotate" from="-28" to="332" dur="34s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="145" ry="54" stroke="#67E8F9" stroke-opacity=".22" transform="rotate(48)">
      <animateTransform attributeName="transform" type="rotate" from="48" to="-312" dur="42s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="8" fill="#C4B5FD" stroke="none" filter="url(#glow)">
      <animate attributeName="r" values="7;11;7" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="0" r="4" fill="#67E8F9" stroke="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-115" cy="0" r="3" fill="#A78BFA" stroke="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="24s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#D8B4FE">
    <circle cx="785" cy="63" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1102" cy="70" r="2.5"><animate attributeName="opacity" values="1;.25;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="286" r="2"><animate attributeName="opacity" values=".15;.9;.15" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="235" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="105" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="82" y="126" fill="#64748B" font-size="13" font-weight="600" letter-spacing="5">HELLO, WORLD  /  I'M</text>
    <text x="76" y="194" fill="url(#title)" font-size="58" font-weight="800" letter-spacing="-2.5">MEHRAB JALILIAN</text>
    <text x="84" y="237" fill="#E2E8F0" font-size="20" font-weight="650" letter-spacing="3.2">AI ENGINEER  <tspan fill="#8B5CF6">✦</tspan>  RESEARCHER</text>
    <text x="84" y="272" fill="#94A3B8" font-size="14" letter-spacing="1.3">MACHINE LEARNING  ·  COMPUTER VISION  ·  NLP  ·  AI SYSTEMS</text>
  </g>

  <g transform="translate(84 310)" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4">
    <rect width="128" height="27" rx="13.5" fill="#8B5CF6" fill-opacity=".16" stroke="#A78BFA" stroke-opacity=".38"/>
    <text x="64" y="18" fill="#DDD6FE" text-anchor="middle">BUILDING AI</text>
    <rect x="140" width="142" height="27" rx="13.5" fill="#22D3EE" fill-opacity=".10" stroke="#67E8F9" stroke-opacity=".30"/>
    <text x="211" y="18" fill="#A5F3FC" text-anchor="middle">OPEN TO IDEAS</text>
  </g>

  <path d="M82 289 H1118" stroke="url(#trace)" stroke-width="1.5" opacity=".8">
    <animate attributeName="opacity" values=".25;.9;.25" dur="5s" repeatCount="indefinite"/>
  </path>
</svg>