<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Mehrab Jalilian — AI Engineer and Researcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="0.55" stop-color="#111116"/>
      <stop offset="1" stop-color="#1b1630"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#ddd6fe" stop-opacity=".95"/>
      <stop offset=".28" stop-color="#a78bfa" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="170" fill="url(#orb)" filter="url(#blur)">
    <animate attributeName="cx" values="1040;960;1040" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;125;80" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="220" r="120" fill="#8b5cf6" opacity=".08" filter="url(#blur)">
    <animate attributeName="r" values="100;145;100" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="110" fill="#f3f0e8" font-size="58" font-weight="700" letter-spacing="-2">MEHRAB JALILIAN</text>
    <text x="84" y="155" fill="#c4b5fd" font-size="22" letter-spacing="4">AI ENGINEER · RESEARCHER</text>
    <text x="84" y="195" fill="#99978f" font-size="15" letter-spacing="1">MACHINE LEARNING · GNNs · LLMs · PRIVACY-PRESERVING AI</text>
  </g>

  <line x1="80" y1="235" x2="1120" y2="235" stroke="url(#line)" stroke-width="2">
    <animate attributeName="x1" values="80;300;80" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1120;900;1120" dur="5s" repeatCount="indefinite"/>
  </line>

  <circle cx="84" cy="235" r="4" fill="#c4b5fd" filter="url(#glow)">
    <animate attributeName="cx" values="84;1116;84" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
