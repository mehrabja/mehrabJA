        <circle r="22" stroke="#A78BFA" stroke-opacity=".35" stroke-dasharray="2 6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/></circle>
      </g>
      <text x="0" y="145" fill="#E6EDF3" font-size="12" font-weight="700" letter-spacing="1.5">DATA</text>
      <text x="0" y="162" fill="#8B949E" font-size="10">Prepare · Understand</text>
    </g>

    <g transform="translate(455 0)">
      <ellipse cx="0" cy="89" rx="72" ry="30" fill="#8B5CF6" opacity=".07" filter="url(#a-soft)"/>
      <path d="M-58 78L0 56L58 78L0 101Z" fill="#101827" stroke="#A78BFA" stroke-opacity=".65"/>
      <path d="M-58 78V91L0 114V101Z" fill="#1C1A32" stroke="#A78BFA" stroke-opacity=".35"/>
      <path d="M0 101V114L58 91V78Z" fill="#151C2A" stroke="#A78BFA" stroke-opacity=".35"/>
      <path d="M-34 77L0 64L34 77L0 91Z" fill="url(#a-top)" stroke="#C4B5FD" stroke-opacity=".75"/>
      <g transform="translate(0 77)" stroke="#C4B5FD" stroke-width="2" fill="none">
        <circle r="5" fill="#A78BFA" fill-opacity=".3"/>
        <circle cx="-14" cy="-7" r="4"/><circle cx="14" cy="-7" r="4"/><circle cx="-14" cy="9" r="4"/><circle cx="14" cy="9" r="4"/>
        <path d="M-10 -5L-4 -2M10 -5L4 -2M-10 7L-4 3M10 7L4 3"/>
        <circle r="22" stroke="#A78BFA" stroke-opacity=".3" stroke-dasharray="2 6"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/></circle>
