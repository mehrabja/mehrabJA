<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 184" role="img" aria-label="Animated engineering workflow from data through models and software systems to deployment">
  <defs>
    <linearGradient id="a-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset=".52" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="a-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20263A"/>
      <stop offset="1" stop-color="#141B2B"/>
    </linearGradient>
    <linearGradient id="a-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25203E"/>
      <stop offset="1" stop-color="#151A2D"/>
    </linearGradient>
    <filter id="a-soft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect x=".5" y=".5" width="1199" height="183" rx="18" fill="#0D1117" stroke="#30363D"/>
  <path d="M32 92H1168" stroke="#30363D" stroke-width="1.2"/>
  <path d="M32 92H1168" stroke="url(#a-line)" stroke-width="2" stroke-dasharray="3 12" opacity=".65">
    <animate attributeName="stroke-dashoffset" values="0;-90" dur="9s" repeatCount="indefinite"/>
  </path>
  <text x="42" y="34" fill="#8B949E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2.8">HOW I APPROACH ENGINEERING</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(165 0)">
