      <text x="0" y="162" fill="#8B949E" font-size="10">Train · Evaluate</text>
    </g>

    <g transform="translate(745 0)">
      <ellipse cx="0" cy="89" rx="72" ry="30" fill="#0891B2" opacity=".07" filter="url(#a-soft)"/>
      <path d="M-58 78L0 56L58 78L0 101Z" fill="#101827" stroke="#67E8F9" stroke-opacity=".6"/>
      <path d="M-58 78V91L0 114V101Z" fill="#122431" stroke="#67E8F9" stroke-opacity=".3"/>
      <path d="M0 101V114L58 91V78Z" fill="#151F2B" stroke="#67E8F9" stroke-opacity=".3"/>
      <path d="M-34 77L0 64L34 77L0 91Z" fill="url(#a-top)" stroke="#A5F3FC" stroke-opacity=".7"/>
      <g transform="translate(0 77)" stroke="#A5F3FC" stroke-width="2" fill="none" stroke-linejoin="round">
        <rect x="-14" y="-10" width="28" height="20" rx="3"/>
        <path d="M-7 -3H7M-7 3H4" stroke-linecap="round"/>
        <circle r="22" stroke="#67E8F9" stroke-opacity=".28" stroke-dasharray="2 6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/></circle>
      </g>
      <text x="0" y="145" fill="#E6EDF3" font-size="12" font-weight="700" letter-spacing="1.5">SYSTEMS</text>
      <text x="0" y="162" fill="#8B949E" font-size="10">Design · Integrate</text>
    </g>

    <g transform="translate(1035 0)">
      <ellipse cx="0" cy="89" rx="72" ry="30" fill="#0891B2" opacity=".07" filter="url(#a-soft)"/>
      <path d="M-58 78L0 56L58 78L0 101Z" fill="#101827" stroke="#67E8F9" stroke-opacity=".6"/>
      <path d="M-58 78V91L0 114V101Z" fill="#122431" stroke="#67E8F9" stroke-opacity=".3"/>
      <path d="M0 101V114L58 91V78Z" fill="#151F2B" stroke="#67E8F9" stroke-opacity=".3"/>
      <path d="M-34 77L0 64L34 77L0 91Z" fill="url(#a-top)" stroke="#A5F3FC" stroke-opacity=".7"/>
      <g transform="translate(0 77)" stroke="#A5F3FC" stroke-width="2" fill="none" stroke-linejoin="round">
        <path d="M-13 2L-3 11L15 -10" stroke-linecap="round"/>
        <path d="M0 -19L17 -10V5C17 15 7 21 0 24C-7 21 -17 15 -17 5V-10Z" opacity=".7"/>
        <circle r="22" stroke="#67E8F9" stroke-opacity=".28" stroke-dasharray="2 6"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="32s" repeatCount="indefinite"/></circle>
