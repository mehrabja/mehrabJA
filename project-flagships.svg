<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-label="Three engineering flagships: ContextForge RAG, RepoSentinel security, ModelOps Launchpad">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090D19"/>
      <stop offset=".52" stop-color="#12152A"/>
      <stop offset="1" stop-color="#1A1230"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <ellipse cx="150" cy="40" rx="240" ry="130" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="150;300;150" dur="13s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1080" cy="300" rx="250" ry="140" fill="#22D3EE" opacity=".08" filter="url(#blur)">
    <animate attributeName="cx" values="1080;940;1080" dur="15s" repeatCount="indefinite"/>
  </ellipse>
  <text x="600" y="48" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="4" text-anchor="middle">THREE FLAGSHIP BUILDS</text>
  <text x="600" y="78" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" letter-spacing="1.5" text-anchor="middle">RESEARCH  ·  PROTECT  ·  SHIP</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(35 112)">
      <rect width="355" height="175" rx="20" fill="#17152B" stroke="#A78BFA" stroke-opacity=".55"/>
      <rect x="1" y="1" width="353" height="173" rx="19" fill="none" stroke="#C4B5FD" stroke-opacity=".15"/>
      <path d="M20 15 H330" stroke="url(#trace)" stroke-width="2" stroke-dasharray="8 14">
        <animate attributeName="stroke-dashoffset" values="0;-88" dur="7s" repeatCount="indefinite"/>
      </path>
      <g transform="translate(53 67)" fill="none" stroke="url(#violet)" stroke-width="2.5">
        <circle r="28" stroke-dasharray="4 6">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        </circle>
        <circle r="8" fill="#A78BFA" stroke="none">
          <animate attributeName="r" values="6;10;6" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <path d="M-14 -3 L-4 -3 M4 -3 L14 -3 M0 -14 V-5 M0 5 V14" stroke-linecap="round"/>
      </g>
      <text x="98" y="58" fill="#DDD6FE" font-size="11" font-weight="700" letter-spacing="2">LLM / RAG ENGINEERING</text>
      <text x="98" y="88" fill="#F8FAFC" font-size="21" font-weight="800">ContextForge</text>
      <text x="28" y="130" fill="#A5B4FC" font-size="12">Retrieval · Sources · Citations · Evaluation</text>
      <text x="28" y="153" fill="#64748B" font-size="10" letter-spacing="1">GROUND ANSWERS IN EVIDENCE</text>
    </g>

    <g transform="translate(422 112)">
      <rect width="355" height="175" rx="20" fill="#121B2B" stroke="#67E8F9" stroke-opacity=".5"/>
      <rect x="1" y="1" width="353" height="173" rx="19" fill="none" stroke="#67E8F9" stroke-opacity=".13"/>
      <path d="M20 15 H330" stroke="url(#trace)" stroke-width="2" stroke-dasharray="8 14">
        <animate attributeName="stroke-dashoffset" values="-88;0" dur="7s" repeatCount="indefinite"/>
      </path>
      <g transform="translate(53 67)" fill="none" stroke="url(#cyan)" stroke-width="2.5" stroke-linejoin="round">
        <path d="M0 -34 L28 -22 V2 C28 20 13 31 0 38 C-13 31 -28 20 -28 2 V-22Z"/>
        <path d="M-13 1 L-4 10 L15 -12" stroke-linecap="round">
          <animate attributeName="stroke-dasharray" values="0 60;40 60" dur="2.6s" repeatCount="indefinite"/>
        </path>
      </g>
      <text x="98" y="58" fill="#A5F3FC" font-size="11" font-weight="700" letter-spacing="2">DEFENSIVE SECURITY</text>
      <text x="98" y="88" fill="#F8FAFC" font-size="21" font-weight="800">RepoSentinel</text>
      <text x="28" y="130" fill="#A5B4FC" font-size="12">Secrets · Static checks · JSON · SARIF</text>
      <text x="28" y="153" fill="#64748B" font-size="10" letter-spacing="1">INSPECT CODE BEFORE RELEASE</text>
    </g>

    <g transform="translate(809 112)">
      <rect width="355" height="175" rx="20" fill="#17152B" stroke="#A78BFA" stroke-opacity=".55"/>
      <rect x="1" y="1" width="353" height="173" rx="19" fill="none" stroke="#C4B5FD" stroke-opacity=".15"/>
      <path d="M20 15 H330" stroke="url(#trace)" stroke-width="2" stroke-dasharray="8 14">
        <animate attributeName="stroke-dashoffset" values="0;-88" dur="7s" repeatCount="indefinite"/>
      </path>
      <g transform="translate(53 67)" fill="none" stroke="url(#violet)" stroke-width="2.5" stroke-linejoin="round">
        <path d="M0 -31 L28 -15 V17 L0 33 L-28 17 V-15Z"/>
        <path d="M-28 -15 L0 2 L28 -15 M0 2 V33" />
        <path d="M-14 -23 L14 -7" stroke="#67E8F9" stroke-width="2">
          <animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/>
        </path>
      </g>
      <text x="98" y="58" fill="#DDD6FE" font-size="11" font-weight="700" letter-spacing="2">DEVOPS / MLOPS</text>
      <text x="98" y="88" fill="#F8FAFC" font-size="21" font-weight="800">ModelOps Launchpad</text>
      <text x="28" y="130" fill="#A5B4FC" font-size="12">Train · Serve · Health · Metrics · Docker</text>
      <text x="28" y="153" fill="#64748B" font-size="10" letter-spacing="1">MOVE MODELS INTO OPERATIONS</text>
    </g>
  </g>

  <path d="M70 307 H1130" stroke="url(#trace)" stroke-width="2">
    <animate attributeName="opacity" values=".25;1;.25" dur="4.5s" repeatCount="indefinite"/>
  </path>
</svg>