    <linearGradient id="pr-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DDD6FE"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="pr-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CFFAFE"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
    <linearGradient id="pr-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9F99D"/><stop offset="1" stop-color="#16A34A"/></linearGradient>
