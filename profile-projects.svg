    <pattern id="pr-grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#A5B4FC" stroke-opacity=".05"/></pattern>
    <filter id="pr-blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="pr-glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
